<svg xmlns="http://www.w3.org/2000/svg" width="960" height="990" viewBox="0 0 960 990" role="img" aria-labelledby="title desc"><title id="title">02 / Auth–Capture 与资金流</title><desc id="desc">先看 Auth 授权、Capture 请款、Clearing 清算、Settlement 机构结算、Payout 商家出款，再区分银行资金与内部余额。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52705d" /></marker></defs><rect width="960" height="990" rx="10" fill="#f9f8f5" /><g font-family="system-ui, sans-serif" fill="#282d28"><text x="32" y="45" font-size="25" fill="#282d28" text-anchor="start" font-weight="600">02 / Auth–Capture 与资金流</text><rect x="32" y="82" width="896" height="220" rx="8" fill="#f1f2ec" stroke="#cdd6ca" transform="translate(0 180)" /><text x="48" y="110" font-size="17" fill="#657365" text-anchor="start" transform="translate(0 180)">外部资金 · 结算账户的实际变动</text><rect x="48" y="158" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d" transform="translate(0 180)" /><text x="148.0" y="199.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">发卡侧结算账户</text><rect x="376" y="158" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d" transform="translate(0 180)" /><text x="476.0" y="199.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">收单侧结算账户</text><rect x="704" y="158" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d" transform="translate(0 180)" /><text x="804.0" y="199.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">商家银行账户</text><polyline points="248,193 374,193" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" transform="translate(0 180)" /><text x="257" y="142" font-size="15" fill="#657365" text-anchor="start" transform="translate(0 180)">网络结算安排</text><polyline points="576,193 702,193" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" transform="translate(0 180)" /><text x="599" y="142" font-size="15" fill="#657365" text-anchor="start" transform="translate(0 180)">协议出款</text><text x="48" y="267" font-size="16" fill="#657365" text-anchor="start" transform="translate(0 180)">机构间通常按批次净额结算；图中箭头不是一条独立的 100 USD 银行流水。</text><rect x="32" y="330" width="896" height="388" rx="8" fill="#f1f2ec" stroke="#cdd6ca" transform="translate(0 180)" /><text x="48" y="358" font-size="17" fill="#657365" text-anchor="start" transform="translate(0 180)">内部账务 · 金额归属与可用性（USD，费用与暂留规则均为演示）</text><rect x="48" y="395" width="200" height="76" rx="6" fill="#f9f8f5" stroke="#52705d" transform="translate(0 180)" /><text x="148.0" y="427.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">交易毛额</text><text x="148.0" y="451.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">100</text><rect x="376" y="385" width="240" height="76" rx="6" fill="#f9f8f5" stroke="#52705d" transform="translate(0 180)" /><text x="496.0" y="417.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">支付费用 3</text><text x="496.0" y="441.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">含渠道成本与服务收入</text><polyline points="248,433 296,433 296,423 374,423" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" transform="translate(0 180)" /><rect x="376" y="491" width="240" height="76" rx="6" fill="#f9f8f5" stroke="#52705d" transform="translate(0 180)" /><text x="496.0" y="523.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">受限商家余额 5</text><text x="496.0" y="547.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">按协议释放或抵扣</text><polyline points="248,433 296,433 296,529 374,529" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" transform="translate(0 180)" /><rect x="376" y="597" width="240" height="76" rx="6" fill="#f9f8f5" stroke="#52705d" transform="translate(0 180)" /><text x="496.0" y="629.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">商家可用余额 92</text><text x="496.0" y="653.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">可安排出款</text><polyline points="248,433 296,433 296,635 374,635" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" transform="translate(0 180)" /><rect x="704" y="597" width="200" height="76" rx="6" fill="#f9f8f5" stroke="#52705d" transform="translate(0 180)" /><text x="804.0" y="629.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">出款占用 92</text><text x="804.0" y="653.0" font-size="17" fill="#282d28" text-anchor="middle" transform="translate(0 180)">完成前禁止重复分配</text><polyline points="616,635 702,635" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" transform="translate(0 180)" /><text x="32" y="755" font-size="16" fill="#282d28" text-anchor="start" transform="translate(0 180)">出款确认：占用余额减少 92；商家银行收款 92。提交失败或退回须按回执补偿。</text><text x="32" y="784" font-size="16" fill="#657365" text-anchor="start" transform="translate(0 180)">暂留 5 仍是对商家的受限义务，不是费用；内部记账本身不会触发银行转账。</text><g><rect x="32" y="86" width="160" height="104" rx="6" fill="#f1f2ec" stroke="#52705d" /><text x="112" y="115" font-size="18" text-anchor="middle" fill="#282d28">Auth</text><text x="112" y="143" font-size="17" text-anchor="middle" fill="#282d28">授权</text><text x="112" y="171" font-size="14" text-anchor="middle" fill="#657365">占用信用额度</text><polyline points="193,138 213,138" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" /><rect x="216" y="86" width="160" height="104" rx="6" fill="#f1f2ec" stroke="#52705d" /><text x="296" y="115" font-size="18" text-anchor="middle" fill="#282d28">Capture</text><text x="296" y="143" font-size="17" text-anchor="middle" fill="#282d28">请款</text><text x="296" y="171" font-size="14" text-anchor="middle" fill="#657365">引用原授权</text><polyline points="377,138 397,138" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" /><rect x="400" y="86" width="160" height="104" rx="6" fill="#f1f2ec" stroke="#52705d" /><text x="480" y="115" font-size="18" text-anchor="middle" fill="#282d28">Clearing</text><text x="480" y="143" font-size="17" text-anchor="middle" fill="#282d28">清算</text><text x="480" y="171" font-size="14" text-anchor="middle" fill="#657365">计算应收应付</text><polyline points="561,138 581,138" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" /><rect x="584" y="86" width="160" height="104" rx="6" fill="#f1f2ec" stroke="#52705d" /><text x="664" y="115" font-size="18" text-anchor="middle" fill="#282d28">Settlement</text><text x="664" y="143" font-size="17" text-anchor="middle" fill="#282d28">机构结算</text><text x="664" y="171" font-size="14" text-anchor="middle" fill="#657365">履行付款义务</text><polyline points="745,138 765,138" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)" /><rect x="768" y="86" width="160" height="104" rx="6" fill="#f1f2ec" stroke="#52705d" /><text x="848" y="115" font-size="18" text-anchor="middle" fill="#282d28">Payout</text><text x="848" y="143" font-size="17" text-anchor="middle" fill="#282d28">商家出款</text><text x="848" y="171" font-size="14" text-anchor="middle" fill="#657365">商家银行收款</text><text x="32" y="222" font-size="16" text-anchor="start" fill="#657365">Auth、Capture 处理交易授权与请款；资金到账还需看后续结算与出款。</text></g></g></svg>