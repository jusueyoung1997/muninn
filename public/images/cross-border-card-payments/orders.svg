<svg xmlns="http://www.w3.org/2000/svg" width="960" height="805" viewBox="0 0 960 805" role="img" aria-labelledby="title desc"><title id="title">03 / 单据关系：用 ID 把证据串起来</title><desc id="desc">一个商家订单可有多个支付单。支付单可关联多次渠道尝试。成功授权关联请款操作。请款事实产生账务和结算项，多项组成结算批次，批次再分配到出款单。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52705d"/></marker></defs><rect width="960" height="805" rx="10" fill="#f9f8f5"/><g font-family="system-ui, sans-serif" fill="#282d28"><text x="32" y="45" font-size="25" fill="#282d28" text-anchor="start" font-weight="600">03 / 单据关系：用 ID 把证据串起来</text><rect x="32" y="112" width="240" height="72" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="152.0" y="154.0" font-size="17" fill="#282d28" text-anchor="middle">商家订单 O1</text><rect x="360" y="112" width="240" height="72" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="480.0" y="154.0" font-size="17" fill="#282d28" text-anchor="middle">支付单 P1</text><rect x="688" y="112" width="240" height="72" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="808.0" y="142.0" font-size="17" fill="#282d28" text-anchor="middle">渠道尝试 A1</text><text x="808.0" y="166.0" font-size="17" fill="#282d28" text-anchor="middle">已明确拒绝</text><polyline points="272,148 358,148" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="298" y="135" font-size="15" fill="#657365" text-anchor="start">1:N</text><polyline points="600,148 686,148" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="625" y="135" font-size="15" fill="#657365" text-anchor="start">1:N</text><rect x="688" y="235" width="240" height="72" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="808.0" y="265.0" font-size="17" fill="#282d28" text-anchor="middle">渠道尝试 A2</text><text x="808.0" y="289.0" font-size="17" fill="#282d28" text-anchor="middle">已授权 · auth_ref</text><polyline points="600,165 644,165 644,211 808,211 808,233" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><rect x="360" y="235" width="240" height="72" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="480.0" y="265.0" font-size="17" fill="#282d28" text-anchor="middle">请款操作 C1</text><text x="480.0" y="289.0" font-size="17" fill="#282d28" text-anchor="middle">capture_ref → auth_ref</text><polyline points="688,271 602,271" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><rect x="32" y="235" width="240" height="72" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="152.0" y="265.0" font-size="17" fill="#282d28" text-anchor="middle">日记账 J1…Jn</text><text x="152.0" y="289.0" font-size="17" fill="#282d28" text-anchor="middle">业务事件唯一入账</text><polyline points="360,271 274,271" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="300" y="257" font-size="15" fill="#657365" text-anchor="start">事件</text><rect x="32" y="377" width="896" height="210" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="405" font-size="17" fill="#657365" text-anchor="start">结算与出款 · 下图假设一个批次一次出款，实际需要分配明细表达拆合</text><rect x="48" y="447" width="200" height="78" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="148.0" y="480.0" font-size="17" fill="#282d28" text-anchor="middle">结算项 S1</text><text x="148.0" y="504.0" font-size="17" fill="#282d28" text-anchor="middle">引用 P1 / C1</text><rect x="376" y="447" width="200" height="78" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="476.0" y="480.0" font-size="17" fill="#282d28" text-anchor="middle">结算批次 B1</text><text x="476.0" y="504.0" font-size="17" fill="#282d28" text-anchor="middle">聚合 S1…Sn</text><rect x="704" y="447" width="200" height="78" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="804.0" y="480.0" font-size="17" fill="#282d28" text-anchor="middle">出款单 PO1</text><text x="804.0" y="504.0" font-size="17" fill="#282d28" text-anchor="middle">引用批次分配记录</text><polyline points="480,307 480,350 20,350 20,486 46,486" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="500" y="345" font-size="15" fill="#657365" text-anchor="start">清算数据 / 费用 / 到期规则</text><polyline points="248,486 374,486" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="289" y="470" font-size="15" fill="#657365" text-anchor="start">N:1</text><polyline points="576,486 702,486" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="32" y="635" font-size="16" fill="#282d28" text-anchor="start">保留两套标识：内部 payment / attempt / operation ID；外部授权 / 请款 / 批次引用。</text><text x="32" y="674" font-size="16" fill="#282d28" text-anchor="start">渠道 HTTP 重试通常复用同一操作与幂等键；明确失败后重新选路，才创建新的尝试。</text><text x="32" y="713" font-size="16" fill="#282d28" text-anchor="start">请款跟随已经成功的授权和渠道上下文，不能把它当成一次可随意换渠道的新付款。</text><text x="32" y="762" font-size="16" fill="#657365" text-anchor="start">图中关系为示例设计；部分请款、分次出款、退款和拒付各有独立单据与事件。</text></g></svg>