<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1135" viewBox="0 0 960 1135" role="img" aria-labelledby="title desc"><title id="title">04 / 各系统分别维护什么状态</title><desc id="desc">不同系统维护不同对象；渠道操作超时进入未知，再由外部证据确认或拒绝。其余状态展示局部成功路径。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52705d"/></marker></defs><rect width="960" height="1135" rx="10" fill="#f9f8f5"/><g font-family="system-ui, sans-serif" fill="#282d28"><text x="32" y="45" font-size="25" fill="#282d28" text-anchor="start" font-weight="600">04 / 各系统分别维护什么状态</text><rect x="32" y="83" width="896" height="133" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="111" font-size="17" fill="#657365" text-anchor="start">支付网关 · 请求 R1</text><rect x="48" y="126" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="173.0" y="152.0" font-size="17" fill="#282d28" text-anchor="middle">RECEIVED</text><rect x="338" y="126" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="463.0" y="152.0" font-size="17" fill="#282d28" text-anchor="middle">VALIDATED</text><rect x="628" y="126" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="753.0" y="152.0" font-size="17" fill="#282d28" text-anchor="middle">ACCEPTED</text><polyline points="298,146 336,146" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="588,146 626,146" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="48" y="196" font-size="14" fill="#657365" text-anchor="start">受理请求不等于支付成功。</text><rect x="32" y="228" width="896" height="133" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="256" font-size="17" fill="#657365" text-anchor="start">支付引擎 · 支付 P1</text><rect x="48" y="271" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="173.0" y="297.0" font-size="17" fill="#282d28" text-anchor="middle">CREATED</text><rect x="338" y="271" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="463.0" y="297.0" font-size="17" fill="#282d28" text-anchor="middle">AUTHORISED</text><rect x="628" y="271" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="753.0" y="297.0" font-size="17" fill="#282d28" text-anchor="middle">CAPTURE_SUBMITTED</text><polyline points="298,291 336,291" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="588,291 626,291" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="48" y="341" font-size="14" fill="#657365" text-anchor="start">Auth 获批 → AUTHORISED；Capture 提交 → CAPTURE_SUBMITTED；失败、取消与过期另行处理。</text><rect x="32" y="373" width="896" height="258" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="401" font-size="17" fill="#657365" text-anchor="start">渠道适配 · 每个 AUTH / CAPTURE 操作</text><rect x="48" y="423" width="180" height="42" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="138.0" y="450.0" font-size="17" fill="#282d28" text-anchor="middle">CREATED</text><rect x="280" y="423" width="180" height="42" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="370.0" y="450.0" font-size="17" fill="#282d28" text-anchor="middle">SENT</text><rect x="720" y="423" width="180" height="42" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="810.0" y="450.0" font-size="17" fill="#282d28" text-anchor="middle">CONFIRMED</text><rect x="490" y="518" width="180" height="42" rx="6" fill="#f9f8f5" stroke="#956339"/><text x="580.0" y="545.0" font-size="17" fill="#956339" text-anchor="middle">UNKNOWN</text><rect x="720" y="518" width="180" height="42" rx="6" fill="#f9f8f5" stroke="#956339"/><text x="810.0" y="545.0" font-size="17" fill="#956339" text-anchor="middle">REJECTED</text><polyline points="228,444 278,444" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="460,444 718,444" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="545" y="432" font-size="15" fill="#657365" text-anchor="start">确认事件</text><polyline points="370,465 370,539 488,539" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="383" y="522" font-size="15" fill="#657365" text-anchor="start">超时</text><polyline points="670,539 695,539 695,444 718,444" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="670,539 718,539" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="490" y="588" font-size="15" fill="#657365" text-anchor="start">查询 / 回调确认结果；未知时不新扣款。</text><text x="48" y="611" font-size="14" fill="#657365" text-anchor="start">CONFIRMED 表示该操作约定的确认语义，不等于到账。</text><rect x="32" y="643" width="896" height="133" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="671" font-size="17" fill="#657365" text-anchor="start">账务 · 日记账 J1</text><rect x="48" y="686" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="173.0" y="712.0" font-size="17" fill="#282d28" text-anchor="middle">事件校验</text><rect x="338" y="686" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="463.0" y="712.0" font-size="17" fill="#282d28" text-anchor="middle">原子过账</text><rect x="628" y="686" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="753.0" y="712.0" font-size="17" fill="#282d28" text-anchor="middle">POSTED</text><polyline points="298,706 336,706" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="588,706 626,706" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="48" y="756" font-size="14" fill="#657365" text-anchor="start">已入账分录不覆盖修改；发生修正时追加冲正或补偿分录。</text><rect x="32" y="788" width="896" height="133" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="816" font-size="17" fill="#657365" text-anchor="start">商户结算 · 批次 B1</text><rect x="48" y="831" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="173.0" y="857.0" font-size="17" fill="#282d28" text-anchor="middle">OPEN</text><rect x="338" y="831" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="463.0" y="857.0" font-size="17" fill="#282d28" text-anchor="middle">CALCULATED</text><rect x="628" y="831" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="753.0" y="857.0" font-size="17" fill="#282d28" text-anchor="middle">PAYABLE</text><polyline points="298,851 336,851" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="588,851 626,851" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="48" y="901" font-size="14" fill="#657365" text-anchor="start">检查到账证据与协议到期条件；分配后记录 ALLOCATED 金额。</text><rect x="32" y="933" width="896" height="133" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="961" font-size="17" fill="#657365" text-anchor="start">出款 · 付款 PO1</text><rect x="48" y="976" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="173.0" y="1002.0" font-size="17" fill="#282d28" text-anchor="middle">CREATED</text><rect x="338" y="976" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="463.0" y="1002.0" font-size="17" fill="#282d28" text-anchor="middle">SUBMITTED</text><rect x="628" y="976" width="250" height="40" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="753.0" y="1002.0" font-size="17" fill="#282d28" text-anchor="middle">PAID</text><polyline points="298,996 336,996" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="588,996 626,996" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="48" y="1046" font-size="14" fill="#657365" text-anchor="start">提交后结果不明保持处理中；失败可释放占用，PAID 后仍需处理 RETURNED。</text><text x="32" y="1110" font-size="16" fill="#282d28" text-anchor="start">状态分属不同对象，不是一列 status 的先后枚举；资金到账由银行 / 渠道证据独立确认。</text></g></svg>