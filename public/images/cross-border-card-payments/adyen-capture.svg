<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="title desc"><title id="title">05 / 接入 Adyen：一笔请款的三个信号</title><desc id="desc">API received代表受理。CAPTURE success true代表有效并已提交外部处理，仍可能后续失败。渠道结算报告与银行流水独立确认资金事实。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52705d"/></marker></defs><rect width="960" height="820" rx="10" fill="#f9f8f5"/><g font-family="system-ui, sans-serif" fill="#282d28"><text x="32" y="45" font-size="25" fill="#282d28" text-anchor="start" font-weight="600">05 / 接入 Adyen：一笔请款的三个信号</text><rect x="32" y="85" width="240" height="56" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="152.0" y="119.0" font-size="17" fill="#282d28" text-anchor="middle">支付引擎</text><rect x="360" y="85" width="240" height="56" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="480.0" y="119.0" font-size="17" fill="#282d28" text-anchor="middle">渠道适配</text><rect x="688" y="85" width="240" height="56" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="808.0" y="119.0" font-size="17" fill="#282d28" text-anchor="middle">Adyen</text><path d="M152 144V672" stroke="#cdd6ca" stroke-dasharray="5 5"/><path d="M480 144V672" stroke="#cdd6ca" stroke-dasharray="5 5"/><path d="M808 144V672" stroke="#cdd6ca" stroke-dasharray="5 5"/><polyline points="152,191 478,191" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="174" y="179" font-size="15" fill="#657365" text-anchor="start">C1：请款 auth_ref / 金额 / 幂等键</text><polyline points="480,240 806,240" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="493" y="228" font-size="15" fill="#657365" text-anchor="start">POST /payments/{ref}/captures</text><polyline points="808,302 482,302" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="510" y="290" font-size="15" fill="#657365" text-anchor="start">received + capture_ref</text><text x="42" y="348" font-size="17" fill="#282d28" text-anchor="start">① C1 仍在处理中；HTTP 受理不等于商家到账。</text><polyline points="808,407 482,407" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="515" y="394" font-size="15" fill="#657365" text-anchor="start">CAPTURE · success=true</text><polyline points="480,453 154,453" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="172" y="440" font-size="15" fill="#657365" text-anchor="start">归一化为“外部请款已提交”事件</text><text x="42" y="500" font-size="17" fill="#282d28" text-anchor="start">② 保存外部事件；该信号之后仍可能收到 CAPTURE_FAILED。</text><polyline points="808,558 482,558" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="515" y="545" font-size="15" fill="#657365" text-anchor="start">结算报告 / 后续失败事件</text><polyline points="480,610 154,610" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="172" y="597" font-size="15" fill="#657365" text-anchor="start">独立更新资金事实 / 触发补偿</text><text x="42" y="660" font-size="17" fill="#282d28" text-anchor="start">③ 到账、费用、批次与银行流水交给对账及账务处理。</text><rect x="32" y="696" width="896" height="90" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="724" font-size="17" fill="#657365" text-anchor="start">必须关联原交易与原操作</text><text x="48" y="759" font-size="17" fill="#282d28" text-anchor="start">paymentPspReference / originalReference → 授权；pspReference → 本次请款。</text></g></svg>