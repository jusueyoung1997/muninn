<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-labelledby="title desc"><title id="title">01 / 系统边界：交易编排与资金处理</title><desc id="desc">自建平台通过渠道适配接入 Adyen 等渠道。交易引擎发布业务事实，驱动账务、结算和出款；各系统独立维护状态。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#52705d"/></marker></defs><rect width="960" height="780" rx="10" fill="#f9f8f5"/><g font-family="system-ui, sans-serif" fill="#282d28"><text x="32" y="45" font-size="25" fill="#282d28" text-anchor="start" font-weight="600">01 / 系统边界：交易编排与资金处理</text><rect x="238" y="82" width="690" height="155" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="254" y="110" font-size="17" fill="#657365" text-anchor="start">自建平台 · 同步交易链路</text><rect x="32" y="139" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="132.0" y="168.0" font-size="17" fill="#282d28" text-anchor="middle">商家服务</text><text x="132.0" y="192.0" font-size="17" fill="#282d28" text-anchor="middle">订单 O1</text><rect x="256" y="139" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="356.0" y="168.0" font-size="17" fill="#282d28" text-anchor="middle">支付网关</text><text x="356.0" y="192.0" font-size="17" fill="#282d28" text-anchor="middle">鉴权 / 请求校验</text><rect x="480" y="139" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="580.0" y="168.0" font-size="17" fill="#282d28" text-anchor="middle">支付引擎</text><text x="580.0" y="192.0" font-size="17" fill="#282d28" text-anchor="middle">支付单 / 路由</text><rect x="704" y="139" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="804.0" y="168.0" font-size="17" fill="#282d28" text-anchor="middle">渠道适配</text><text x="804.0" y="192.0" font-size="17" fill="#282d28" text-anchor="middle">操作单 / 外部映射</text><polyline points="232,174 248,174" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="456,174 472,174" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="680,174 696,174" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><rect x="32" y="280" width="896" height="155" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="308" font-size="17" fill="#657365" text-anchor="start">外部角色 · 渠道可能同时提供网关、处理及收单服务</text><rect x="48" y="339" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="148.0" y="368.0" font-size="17" fill="#282d28" text-anchor="middle">发卡行</text><text x="148.0" y="392.0" font-size="17" fill="#282d28" text-anchor="middle">授权决定</text><rect x="376" y="339" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="476.0" y="368.0" font-size="17" fill="#282d28" text-anchor="middle">卡网络</text><text x="476.0" y="392.0" font-size="17" fill="#282d28" text-anchor="middle">转接 / 清算结算</text><rect x="704" y="339" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="804.0" y="368.0" font-size="17" fill="#282d28" text-anchor="middle">Adyen 等渠道</text><text x="804.0" y="392.0" font-size="17" fill="#282d28" text-anchor="middle">依合同确定收单关系</text><polyline points="804,210 804,338" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="815" y="269" font-size="15" fill="#657365" text-anchor="start">API / Webhook</text><polyline points="704,374 578,374" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><polyline points="376,374 250,374" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="32" y="474" font-size="17" fill="#657365" text-anchor="start">支付引擎产生业务事实，异步驱动下面的系统；这些框不代表银行资金逐站流经。</text><rect x="32" y="504" width="896" height="176" rx="8" fill="#f1f2ec" stroke="#cdd6ca"/><text x="48" y="532" font-size="17" fill="#657365" text-anchor="start">自建平台 · 核算与付款链路</text><rect x="48" y="569" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="148.0" y="598.0" font-size="17" fill="#282d28" text-anchor="middle">账务</text><text x="148.0" y="622.0" font-size="17" fill="#282d28" text-anchor="middle">日记账 / 余额</text><rect x="376" y="569" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="476.0" y="598.0" font-size="17" fill="#282d28" text-anchor="middle">商户结算</text><text x="476.0" y="622.0" font-size="17" fill="#282d28" text-anchor="middle">结算项 / 批次</text><rect x="704" y="569" width="200" height="70" rx="6" fill="#f9f8f5" stroke="#52705d"/><text x="804.0" y="598.0" font-size="17" fill="#282d28" text-anchor="middle">出款</text><text x="804.0" y="622.0" font-size="17" fill="#282d28" text-anchor="middle">付款单 / 银行回执</text><polyline points="248,604 374,604" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="263" y="555" font-size="15" fill="#657365" text-anchor="start">已入账事实</text><polyline points="576,604 702,604" fill="none" stroke="#52705d" stroke-width="1.6" marker-end="url(#a)"/><text x="597" y="555" font-size="15" fill="#657365" text-anchor="start">可付金额</text><text x="32" y="719" font-size="18" fill="#282d28" text-anchor="start">对账：渠道报表、内部流水、银行流水之间建立证据关联。</text><text x="32" y="750" font-size="17" fill="#657365" text-anchor="start">外部角色与内部模块不能画成同一条“钱经过的流水线”。</text></g></svg>